<!-- start custom head snippets (overrides the Hacker theme's head-custom.html) -->

<!-- Keep the theme's own color meta tags -->
{% include head-custom-theme-colors.html %}

<!-- Tailwind utilities, compiled by GitHub Actions from assets/css/tailwind.input.css -->
<link rel="stylesheet" href="{{ '/assets/css/tailwind.css?v=' | append: site.github.build_revision | relative_url }}">

<!-- Hide Alpine-controlled elements until Alpine has started -->
<style>[x-cloak] { display: none !important; }</style>

<!-- Site components must load BEFORE Alpine so they're registered on alpine:init.
     Both scripts use defer, so they run in this order after the HTML is parsed. -->
<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.17.5/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/focus@3.17.5/dist/cdn.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>

<!-- end custom head snippets -->
